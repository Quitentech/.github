<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="160" viewBox="0 0 1280 160" fill="none">
  <defs>
    <!-- Sharp, professional gradient for the brand name -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#473ad6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    
    <!-- Pattern for industrial texture -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Transparent Background with subtle technical grid -->
  <rect width="1280" height="160" fill="url(#grid)" />

  <!-- Structural "Industrial" Accents -->
  <g opacity="0.4">
    <path d="M 20 40 L 20 20 L 60 20" stroke="#473ad6" stroke-width="2" />
    <path d="M 1220 120 L 1260 120 L 1260 140" stroke="#c026d3" stroke-width="2" />
    <line x1="80" y1="80" x2="280" y2="80" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="1000" y1="80" x2="1200" y2="80" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="4 4" />
  </g>

  <!-- Technical Data Points (SEO/Contextual Metadata) -->
  <g font-family="monospace" font-size="10" fill="#7c3aed" opacity="0.6" letter-spacing="1">
    <text x="40" y="35">ORG: ESSENTIAL_DEVS</text>
    <text x="40" y="140">STATUS: REBUILDING_V2</text>
    <text x="1240" y="35" text-anchor="end">LOC: EDGE_NODES</text>
    <text x="1240" y="140" text-anchor="end">RELEASE: 08.08.2026</text>
  </g>

  <!-- QUITEN Main Branding -->
  <text x="640" y="90" text-anchor="middle" 
    font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', monospace" 
    font-size="62" font-weight="800" 
    letter-spacing="12" fill="url(#brandGradient)">QUITEN</text>

  <!-- Professional Tagline -->
  <text x="640" y="120" text-anchor="middle" 
    font-family="monospace" 
    font-size="12" font-weight="400" 
    letter-spacing="6" fill="#473ad6" opacity="0.9">
    DEVELOPER INFRASTRUCTURE &amp; OPEN SOURCE REGISTRY
  </text>
  
  <!-- Subtle progress indicator line -->
  <rect x="540" y="135" width="200" height="1" fill="#7c3aed" opacity="0.3" />
  <rect x="540" y="135" width="60" height="1" fill="#c026d3" />
</svg>
