<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="140" viewBox="0 0 1280 140">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#020810"/>
      <stop offset="50%"  stop-color="#040f1e"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#020810" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="60%"  stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#020810" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .brand {
        font-family: 'Courier New', monospace;
        font-size: 58px;
        font-weight: 900;
        letter-spacing: 14px;
        fill: url(#wordGrad);
        filter: url(#glow);
      }
      .tag {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        letter-spacing: 5px;
        fill: #1d4ed8;
      }
      .dot {
        fill: #3b82f6;
        filter: url(#glow);
      }
    </style>
  </defs>

  <rect width="1280" height="140" fill="url(#bg)"/>
  <rect x="0" y="0"   width="1280" height="1" fill="url(#accent)"/>
  <rect x="0" y="139" width="1280" height="1" fill="url(#accent)"/>

  <!-- corner brackets -->
  <path d="M40,28 L40,18 L50,18"  stroke="#1d4ed8" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M1230,28 L1230,18 L1220,18" stroke="#1d4ed8" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M40,112 L40,122 L50,122" stroke="#1d4ed8" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M1230,112 L1230,122 L1220,122" stroke="#1d4ed8" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- main word -->
  <text x="640" y="88" text-anchor="middle" class="brand">QUITEN</text>

  <!-- tagline -->
  <text x="640" y="118" text-anchor="middle" class="tag">DEVELOPER TOOLS  ·  OPEN SOURCE  ·  COMMUNITY</text>

  <!-- small domain hint top right -->
  <text x="1195" y="36" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#1e3a5f" letter-spacing="1">quiten.tech</text>
</svg>
